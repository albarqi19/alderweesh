server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;
    absolute_redirect off;
    include /etc/nginx/snippets/security.conf;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;
    location = /login { return 301 https://mktb-abdallh-salh-abdallh-aldr.alraedlaw.com/login; }
    location = /admin { return 301 https://mktb-abdallh-salh-abdallh-aldr.alraedlaw.com/login; }
    location ~* \.(webp|png|jpe?g|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
